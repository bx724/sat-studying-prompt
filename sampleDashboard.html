<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Command Center</title>
<style>
:root{
  color-scheme:light;
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efea; --line:#e2ded6; --line2:#cfc9be;
  --text:#1b1a17; --dim:#6b675e; --faint:#9a958a;
  --accent:#4f46c9; --accent-soft:#ecebfa;
  --test:#c4344f; --test-soft:#fbe9ec;
  --ok:#2c8a5f; --ok-soft:#e6f4ec;
  --warn:#c07a12; --warn-soft:#fbf0dd;
  --bad:#c4344f;
  --c-content:#3b6fd4; --c-misread:#7a4fc9; --c-careless:#d1742a; --c-timing:#1f8f8a;
  --rail:#e7e3db;
  --shadow:0 1px 2px rgba(20,18,14,.05), 0 4px 14px -6px rgba(20,18,14,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111114; --surface:#191a1f; --surface2:#202127; --line:#2b2d34; --line2:#3a3d46;
    --text:#eceae5; --dim:#9d9a93; --faint:#6e6b66;
    --accent:#8b86f0; --accent-soft:#23224a;
    --test:#f0768d; --test-soft:#3a1d25;
    --ok:#5fc294; --ok-soft:#16301f;
    --warn:#e2a244; --warn-soft:#332512;
    --bad:#f0768d;
    --c-content:#6b9bf0; --c-misread:#a888f5; --c-careless:#e59b56; --c-timing:#4fc2bb;
    --rail:#2b2d34;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px -6px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111114; --surface:#191a1f; --surface2:#202127; --line:#2b2d34; --line2:#3a3d46;
  --text:#eceae5; --dim:#9d9a93; --faint:#6e6b66;
  --accent:#8b86f0; --accent-soft:#23224a;
  --test:#f0768d; --test-soft:#3a1d25;
  --ok:#5fc294; --ok-soft:#16301f;
  --warn:#e2a244; --warn-soft:#332512;
  --bad:#f0768d;
  --c-content:#6b9bf0; --c-misread:#a888f5; --c-careless:#e59b56; --c-timing:#4fc2bb;
  --rail:#2b2d34;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px -6px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.wrap{max-width:1120px; margin:0 auto; padding:0 22px 90px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.hbar{max-width:1120px; margin:0 auto; padding:14px 22px 0; display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto}
.brand h1{font-size:16px; font-weight:650; letter-spacing:-.01em; margin:0}
.brand span{font-size:11.5px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
.cd{display:flex; align-items:baseline; gap:7px}
.cd b{font-size:30px; font-weight:660; letter-spacing:-.03em; line-height:1}
.cd i{font-style:normal; font-size:11.5px; color:var(--dim); letter-spacing:.04em; text-transform:uppercase; max-width:74px; line-height:1.25}
.cd.proj{position:relative; align-items:flex-end; gap:9px}
.cd.proj b{color:var(--warn)}
.confbox{display:flex; flex-direction:column; gap:4px; padding-bottom:2px; min-width:66px}
.confbar{display:block; height:4px; border-radius:3px; background:var(--rail); overflow:hidden}
.confbar span{display:block; height:100%; border-radius:3px; background:var(--warn); transition:width .35s ease}
.confbox em{font-style:normal; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); white-space:nowrap}
.themebtn{
  background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer;
  border-radius:7px; width:30px; height:30px; font-size:14px; line-height:1; align-self:center;
}
.themebtn:hover{border-color:var(--line2); color:var(--text)}
nav{max-width:1120px; margin:0 auto; padding:10px 22px 0; display:flex; gap:2px; overflow-x:auto}
nav button{
  background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
  font:inherit; font-size:13.5px; font-weight:500; padding:8px 13px 9px; cursor:pointer; white-space:nowrap;
}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--text); font-weight:600; border-bottom-color:var(--accent)}
nav button .pill{
  display:inline-block; margin-left:6px; background:var(--surface2); color:var(--dim);
  border-radius:20px; padding:1px 6px; font-size:10.5px; font-weight:600; vertical-align:1px;
}
nav button[aria-selected="true"] .pill{background:var(--accent-soft); color:var(--accent)}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.lab{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:640}
h2.sec{
  font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); font-weight:640;
  margin:34px 0 12px; display:flex; align-items:center; gap:12px;
}
h2.sec::after{content:""; flex:1; height:1px; background:var(--line)}
.muted{color:var(--dim)}
.tiny{font-size:12px}
.grid{display:grid; gap:14px}
.hint{
  font-size:12.5px; color:var(--dim); background:var(--surface2); border:1px dashed var(--line2);
  border-radius:9px; padding:11px 13px; line-height:1.55;
}
.hint code{
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--surface);
  border:1px solid var(--line); border-radius:5px; padding:1.5px 5px; color:var(--text);
}
.empty{text-align:center; padding:46px 22px; color:var(--dim)}
.empty .big{font-size:15px; color:var(--text); font-weight:560; margin-bottom:6px}
[hidden]{display:none !important}

/* ---------- status strip ---------- */
.strip{display:grid; grid-template-columns:1.15fr 1fr; gap:14px; margin:22px 0 0}
@media(max-width:820px){.strip{grid-template-columns:1fr}}
.today{padding:16px 18px; display:flex; flex-direction:column; gap:9px}
.today .top{display:flex; align-items:center; gap:9px}
.today .date{font-size:12.5px; font-weight:600}
.today .tag{font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; padding:2.5px 7px; border-radius:5px}
.today .task{font-size:15.5px; line-height:1.45; font-weight:500}
.today .meta{display:flex; gap:16px; align-items:center; font-size:12px; color:var(--dim); margin-top:auto; padding-top:4px}

.gap{padding:16px 18px}
.gap .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px}
.gap .head b{font-size:22px; font-weight:660; letter-spacing:-.02em}
.rail{height:9px; background:var(--rail); border-radius:5px; overflow:hidden; display:flex}
.rail>span{display:block; height:100%}
.legend{display:flex; gap:15px; margin-top:11px; flex-wrap:wrap; font-size:12px; color:var(--dim)}
.legend i{width:8px; height:8px; border-radius:2.5px; display:inline-block; margin-right:6px; vertical-align:0}
.legend b{color:var(--text); font-weight:600}

/* ---------- calendar ---------- */
.calhead{display:grid; grid-template-columns:118px repeat(7,1fr); gap:7px; margin-bottom:7px; padding:0 2px}
.calhead div{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:640; text-align:center}
.calhead div:first-child{text-align:left}
.week{display:grid; grid-template-columns:118px repeat(7,1fr); gap:7px; margin-bottom:7px}
.wlabel{padding:9px 2px 0; min-width:0}
.wlabel b{display:block; font-size:12.5px; font-weight:640; letter-spacing:-.01em}
.wlabel span{display:block; font-size:11px; color:var(--faint); line-height:1.35; margin-top:2px}
.day{
  position:relative; text-align:left; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--line2); border-radius:9px; padding:8px 9px 9px; cursor:pointer;
  min-height:88px; display:flex; flex-direction:column; gap:4px; font:inherit; color:inherit;
  transition:border-color .12s, transform .12s, box-shadow .12s;
}
.day:hover{border-color:var(--line2); transform:translateY(-1px); box-shadow:var(--shadow)}
.day .dnum{display:flex; align-items:baseline; justify-content:space-between; gap:4px}
.day .dnum b{font-size:13.5px; font-weight:640; letter-spacing:-.01em}
.day .dnum em{font-style:normal; font-size:10px; color:var(--faint); font-weight:600}
.day p{margin:0; font-size:11.5px; line-height:1.4; color:var(--dim); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
.day .mins{margin-top:auto; font-size:10.5px; font-weight:600; color:var(--faint)}
.day.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.day.today{border-color:var(--accent)}
.day.today::after{
  content:"TODAY"; position:absolute; top:-8px; right:7px; background:var(--accent); color:#fff;
  font-size:9px; font-weight:700; letter-spacing:.07em; padding:2px 5px; border-radius:4px;
}
.day.done{background:var(--ok-soft); border-left-color:var(--ok)}
.day.done .dnum b::after{content:" ✓"; color:var(--ok); font-size:12px}
.day.past:not(.done){opacity:.5}
.day.t-test{border-left-color:var(--test); background:var(--test-soft)}
.day.t-review{border-left-color:var(--accent)}
.day.t-drill{border-left-color:var(--line2)}
.day.t-rest{border-left-color:var(--line); background:var(--surface2)}
.day.done.t-test,.day.done.t-rest{background:var(--ok-soft)}
.day .flag{
  font-size:9.5px; font-weight:680; letter-spacing:.04em; text-transform:uppercase;
  color:var(--warn); background:var(--warn-soft); border-radius:4px; padding:1.5px 5px; align-self:flex-start;
}
.testday{
  margin-top:14px; border:1px solid var(--test); border-radius:11px; background:var(--test-soft);
  padding:15px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.testday b{font-size:15px; font-weight:660; color:var(--test)}
.testday span{font-size:12.5px; color:var(--dim)}
.detail{margin-top:14px; padding:16px 18px}
.detail h3{margin:0 0 4px; font-size:15px; font-weight:620; letter-spacing:-.01em}
.detail .sub{font-size:12px; color:var(--faint); margin-bottom:11px}
.detail p{margin:0 0 11px; font-size:14px; line-height:1.55}
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{
  font-size:11.5px; font-weight:560; padding:3.5px 9px; border-radius:6px;
  background:var(--surface2); color:var(--dim); border:1px solid var(--line);
}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:13px 15px 14px; position:relative; overflow:hidden}
.tile::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--c)}
.tile .n{font-size:27px; font-weight:660; letter-spacing:-.03em; line-height:1.1}
.tile .k{font-size:12px; font-weight:600; margin-top:1px}
.tile .d{font-size:11.5px; color:var(--faint); line-height:1.4; margin-top:5px}
.tile.alarm{border-color:var(--bad); background:var(--test-soft)}
.tile.alarm .n,.tile.alarm .k{color:var(--bad)}

/* ---------- bars ---------- */
.bars{display:flex; flex-direction:column; gap:9px}
.bar{display:grid; grid-template-columns:132px 1fr 46px; gap:11px; align-items:center; font-size:12.5px}
.bar .nm{color:var(--dim); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .tr{height:20px; background:var(--rail); border-radius:5px; overflow:hidden; display:flex}
.bar .tr>span{height:100%; display:block; transition:width .3s}
.bar .vl{font-weight:640; font-size:12.5px}
@media(max-width:600px){.bar{grid-template-columns:96px 1fr 40px}}

.wkbars{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:end}
.wkcol{display:flex; flex-direction:column; align-items:center; gap:8px}
.wkstack{width:100%; max-width:76px; display:flex; flex-direction:column-reverse; justify-content:flex-start; border-radius:5px 5px 0 0; overflow:hidden}
.wkstack>span{width:100%; min-height:0}
.wkbase{width:100%; height:1px; background:var(--line2)}
.wkcol .cap{font-size:11px; color:var(--dim); text-align:center; line-height:1.35}
.wkcol .cap b{display:block; color:var(--text); font-weight:620; font-size:12px}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  font-weight:640; padding:0 12px 8px; border-bottom:1px solid var(--line);
}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
.why{font-size:10.5px; font-weight:680; letter-spacing:.04em; text-transform:uppercase; padding:2.5px 7px; border-radius:5px; color:#fff; white-space:nowrap}
.ac{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.ac s{color:var(--faint); text-decoration:line-through}
.ac b{color:var(--ok)}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ---------- band bars ---------- */
.band{display:grid; grid-template-columns:190px 1fr 78px; gap:13px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.band:last-child{border-bottom:0}
.band .nm b{display:block; font-size:13px; font-weight:580; letter-spacing:-.005em}
.band .nm span{font-size:11px; color:var(--faint)}
.band .scale{position:relative; height:22px; background:var(--rail); border-radius:5px; overflow:hidden}
.band .rng{position:absolute; top:0; bottom:0; border-radius:4px; background:var(--accent); opacity:.85}
.band .rng.weak{background:var(--bad)}
.band .rng.strong{background:var(--ok)}
.band .txt{font-size:12px; font-weight:620; text-align:right}
.band .txt em{display:block; font-style:normal; font-size:10.5px; color:var(--faint); font-weight:500}
.axis{display:flex; justify-content:space-between; font-size:10px; color:var(--faint); padding:5px 0 0; margin-left:203px; margin-right:91px}
@media(max-width:700px){.band{grid-template-columns:1fr; gap:5px} .axis{margin:0}}

/* ---------- rules ---------- */
.rules{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; align-items:start}
@media(max-width:820px){.rules{grid-template-columns:1fr}}
.rule{padding:0; overflow:hidden}
.rule>summary{
  list-style:none; cursor:pointer; padding:13px 15px; display:flex; align-items:baseline; gap:10px;
}
.rule>summary::-webkit-details-marker{display:none}
.rule>summary:hover{background:var(--surface2)}
.rule .n{
  font:11.5px/1 ui-monospace,monospace; font-weight:700; color:var(--accent); background:var(--accent-soft);
  border-radius:5px; padding:5px 6px; flex:none;
}
.rule .t{font-size:13.5px; font-weight:600; letter-spacing:-.005em; flex:1}
.rule .cnt{font-size:11px; font-weight:680; color:var(--bad); background:var(--test-soft); border-radius:20px; padding:2px 8px; flex:none}
.rule .body{padding:0 15px 14px; font-size:13px; line-height:1.6; color:var(--dim)}
.rule .body em{color:var(--text); font-style:normal; font-weight:560}
.rule .body .ex{
  display:block; margin:9px 0 0; font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--surface2); border-left:2px solid var(--line2); border-radius:0 6px 6px 0; padding:8px 11px; color:var(--text);
}
.rule[open]>summary{border-bottom:1px solid var(--line)}

/* ---------- vocab ---------- */
.searchbar{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:10px 13px; font:inherit; font-size:13.5px; color:var(--text); margin-bottom:14px;
}
.searchbar:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.vgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:11px}
.vc{
  padding:13px 14px; cursor:pointer; min-height:96px; display:flex; flex-direction:column; gap:5px;
  transition:border-color .12s, transform .12s;
}
.vc:hover{border-color:var(--line2); transform:translateY(-1px)}
.vc .w{font-size:14.5px; font-weight:620; letter-spacing:-.01em}
.vc .ev{font-size:11.5px; color:var(--faint); line-height:1.4}
.vc .sat{font-size:12.5px; line-height:1.5; color:var(--text); margin-top:auto}
.vc .sat .k{color:var(--accent); font-weight:640; font-size:10px; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:2px}
.vc .veil{font-size:12px; color:var(--faint); margin-top:auto; font-style:italic}
.vc.flip{border-color:var(--accent)}
.vc .miss{position:absolute; top:10px; right:11px; font-size:10.5px; font-weight:680; color:var(--bad)}
.vc{position:relative}
</style>
</head>
<body>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   EDIT ZONE — everything below is data. Nothing else in this file needs
   touching. Just tell your coding agent what happened; e.g.

     "log a miss: colons, picked B should be C, careless, from SEC drill"
     "mark Saturday done"
     "practice test 2: RW 660, Math 670"
     "add vocab: tenuous — weak, barely holding together"

   Categories for `why` are exactly: content | misread | careless | timing

   THIS IS SAMPLE DATA for a made-up student. Every score, miss and word is
   invented. The dates use day(n), days from the plan's first Saturday, so
   the demo always looks mid-plan whenever it is opened. A real study folder
   replaces this whole block and uses plain "YYYY-MM-DD" strings instead.
   ══════════════════════════════════════════════════════════════════════════ */

const day = (()=>{
  const t = new Date(); t.setHours(0,0,0,0);
  const s = new Date(t); s.setDate(t.getDate() - 14);
  s.setDate(s.getDate() - (s.getDay()+1)%7);          // back to a Saturday
  return n => { const d = new Date(s); d.setDate(s.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
})();
const done = n => { const t = new Date(); t.setHours(0,0,0,0); return new Date(day(n)+"T00:00") < t; };

const DATA = {

/* ── the fixed frame ─────────────────────────────────────────────────── */
meta: {
  testDate:   day(28),
  planStart:  day(0),
  target:     1400,
  fallback:   1350,          // the target if the checkpoint says no-go
  baseline:   { date:day(-21), rw:610, math:640 }
},

/* ── practice tests. Fill rw/math as they happen; null = not yet ─────── */
scores: [
  { date:day(-21), label:"Real SAT (baseline)", rw:610,  math:640  },
  { date:day(1),   label:"Practice #1",         rw:640,  math:650  },
  { date:day(8),   label:"Practice #2",         rw:660,  math:670  },
  { date:day(21),  label:"Practice #3",         rw:null, math:null }
],

/* ── domain bands. bands[i] belongs to scores[i], null = not yet ────────
     Each band is [low, high] on the 200-800 scale.                      */
domains: {
  rw: [
    { code:"INI", name:"Information and Ideas",          weight:26, bands:[[600,660], [620,680], [650,710], null] },
    { code:"CAS", name:"Craft and Structure",            weight:28, bands:[[560,620], [600,660], [620,680], null] },
    { code:"EOI", name:"Expression of Ideas",            weight:20, bands:[[620,680], [640,700], [660,720], null] },
    { code:"SEC", name:"Standard English Conventions",   weight:26, bands:[[540,600], [580,640], [630,690], null] }
  ],
  math: [
    { code:"ALG", name:"Algebra",                        weight:35, bands:[[620,680], [640,700], [660,720], null] },
    { code:"ADV", name:"Advanced Math",                  weight:35, bands:[[580,640], [610,670], [630,690], null] },
    { code:"PSD", name:"Problem-Solving and Data",       weight:15, bands:[[640,700], [650,710], [680,740], null] },
    { code:"GEO", name:"Geometry and Trigonometry",      weight:15, bands:[[560,620], [570,630], [600,660], null] }
  ]
},

/* ── the calendar. type: test | review | drill | rest ────────────────── *
 *  Weeks run Saturday to Friday. Flip `done:true` when a day is finished. */
weeks: [
  { n:1, title:"Foundations", note:"Learn the 8 rules, first full test",
    days:[
      { date:day(0),  task:"Learn all 8 grammar rules, write them out. 30 SEC questions untimed. Start the error log.", mins:180, type:"review", done:true, flag:"22/30 · SEC Set A" },
      { date:day(1),  task:"Full-length practice test #1, Bluebook, real conditions. Score it and stop.", mins:180, type:"test", done:true, flag:"1290 · RW 640, Math 650" },
      { date:day(2),  task:"Review test #1: every miss into the error log with a why tag.", mins:60, type:"review", done:true, flag:"8 misses logged" },
      { date:day(3),  task:"Rules 1-4. 20 SEC questions. + 8 math, Algebra.", mins:60, type:"drill", done:true, flag:"15/20 · Set B" },

  { n:1, title:"Independent vs dependent clauses", tags:["clause","clauses","independent","dependent","fragment"],
    body:"An independent clause has a subject and verb and stands alone. A dependent clause opens with a subordinator (because, although, when, since, if, while, that, which, who) and cannot. <em>Every punctuation question starts here.</em> Read the text on each side of the mark and ask: can this stand alone?" },

    body:"Three legal joins: period, semicolon, or comma + FANBOYS (for, and, nor, but, or, yet, so). A bare comma between two independent clauses is a <em>comma splice</em> and is always wrong.<span class='ex'>however / therefore / moreover / nevertheless are NOT FANBOYS.\nX, however, Y is a splice. It needs a semicolon or period.</span>" },
  { n:3, title:"Non-essential elements", tags:["nonessential","non-essential","parenthetical","dashes","paired"],

  { n:5, title:"Subject-verb agreement", tags:["subject-verb","sv","agreement","subject verb"],
    body:"Find the actual subject and ignore everything between it and the verb — usually a prepositional phrase planted to confuse you.<span class='ex'>The box of nails IS heavy.   (subject = box, not nails)</span>Watch inverted order (<em>There are three reasons</em>), collective nouns, and each / every / neither, which are singular." },
  { n:6, title:"Pronoun agreement and ambiguity", tags:["pronoun","pronouns","its","their","whose","ambiguity"],

  { n:7, title:"Modifier placement", tags:["modifier","modifiers","dangling","misplaced"],
    body:"The thing being described comes immediately after the modifying phrase.<span class='ex'>Running late, the bus was missed.   ✗ the bus was not running late</span>Whatever the phrase describes has to be the very next thing in the sentence &mdash; and <em>the next thing means the head noun, not the first word.</em> Delete every possessive, every <em>of</em>-phrase and the word <em>there</em> from the front of the choice; what is left is what the modifier claims to describe.<span class='ex'>Despite being lightweight, the bicycle&rsquo;s two flaws are&hellip;   ✗ head is &lsquo;flaws&rsquo;, and flaws are not lightweight<br>Despite being lightweight, the bicycle has two flaws:   ✓</span>The possessive is a trap in both directions &mdash; sometimes the right answer needs it, sometimes it is what breaks the answer. Run the deletion test, do not guess the direction." },

<script>
/* ─────────── helpers ─────────── */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sept","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const D  = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const KEY = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const FMT = s => { const t=D(s); return MON[t.getMonth()]+" "+t.getDate(); };
const DAYS = (a,b) => Math.round((b-a)/864e5);
const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const TODAY = (()=>{ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); })();
const TKEY = KEY(TODAY);

const ALLDAYS = DATA.weeks.flatMap(w => w.days.map(d => ({...d, week:w.n})));
const WHY = { content:"--c-content", misread:"--c-misread", careless:"--c-careless", timing:"--c-timing" };
const WHYTEXT = {
  content:"Did not know the rule, concept, or word.",
  misread:"Knew it, answered a different question than the one asked.",
  careless:"Knew it, read it right, still picked wrong.",
  timing:"Rushed it or ran out of clock."
};
const cvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* which plan week does a date fall in? */
function weekOf(dstr){
  for(const w of DATA.weeks){
    const a=D(w.days[0].date), b=D(w.days[w.days.length-1].date), x=D(dstr);
    if(x>=a && x<=b) return w.n;
  }
  return null;
}

/* ═══════════ prediction primitives (used by the header and by Topics) ═══
   `wilson` is the 95% interval on a proportion. `predictFor` turns logged
   practice for one domain into a score band through the two anchors in
   DATA.predict. Both live at top level because the header projection and the
   Topics tab must never disagree about the number. ═════════════════════ */
function wilson(k, n, z){
  const p = k/n, d = 1 + z*z/n;
  const c = (p + z*z/(2*n))/d;
  const h = z/d * Math.sqrt(p*(1-p)/n + z*z/(4*n*n));
  return [Math.max(0,c-h), Math.min(1,c+h)];
}
/* sets defaults to every logged set for the domain; pass a subset to ask
   "what does only the evidence since the last test say?" */
/* the latest measured band for a domain, as "lo–hi" */
function bandNow(code){
  const d = [...DATA.domains.rw, ...DATA.domains.math].find(x=>x.code===code);
  const b = d && [...d.bands].reverse().find(x=>x);
  return b ? b[0]+"–"+b[1] : "unmeasured";
}
function predictFor(code, sets){
  const P = DATA.predict;
  sets = sets || (DATA.practice||[]).filter(s=>s.domain===code);
  if(!P || !sets.length) return null;
  const n = sets.reduce((a,s)=>a+s.total,0);
  if(!n) return null;
  const k = sets.reduce((a,s)=>a+s.correct,0);
  const untimedShare = sets.reduce((a,s)=>a+(s.timed?0:s.total),0)/n;
  const [A,B] = P.anchors;
  const map = x => A.score + (x-A.acc)*(B.score-A.score)/(B.acc-A.acc);
  const pen = P.untimed * untimedShare;
  const R  = x => Math.round(Math.max(200, Math.min(800, map(x)-pen))/10)*10;
  const [lo,hi] = wilson(k, n, P.z);
  /* what the band would look like at larger n if accuracy held — this is
     the answer to "does it get tighter", shown rather than asserted */
  const proj = [n*2, n*4, n*8].map(N=>{
    const [a,b] = wilson(Math.round(k/n*N), N, P.z);
    return { n:Math.round(N), width: R(b)-R(a) };
  });
  return { n, k, acc:k/n, sets:sets.length, untimedShare,
           lo:R(lo), hi:R(hi), mid:R(k/n), width:R(hi)-R(lo), proj };
}

/* ═══════════ the projection behind the number at the top ═══════════════
   Level comes from the most recent measured section scores. Those are real
   reported numbers and nothing beats them. Movement comes only from domain
   evidence logged AFTER that test — so with no fresh evidence the projection
   IS the last score, and it moves only when new data says it should.

   The interval is a 95% half-width built from three sources, in quadrature:
     · fresh practice   — the Wilson band on each domain, weighted by that
                          domain's share of the section, widened by the untimed
                          share, and summed (not squared) within a section
                          because domains move together
     · section noise    — the bounce a section score has anyway
     · drift            — uncertainty that grows the longer it has been since
                          anything was measured
   Confidence is that half-width read against `confRef`. A full test resets
   it; logged practice and elapsed time both lower it. See docs/projection.md ══ */
const PROJ = (()=>{
  const P = DATA.predict;
  if(!P) return null;
  let li = -1;
  DATA.scores.forEach((sc,i)=>{ if(sc.rw!=null && sc.math!=null) li = i; });
  if(li < 0) return null;
  const base = DATA.scores[li];

  function section(list, measured){
    let delta = 0, half = 0, nq = 0, moved = [];
    list.forEach(d=>{
      const w = d.weight/100;
      /* the band this domain had on that same test — the thing fresh
         evidence is measured against */
      let ref = null;
      for(let i=Math.min(li, d.bands.length-1); i>=0; i--) if(d.bands[i]){ ref = d.bands[i]; break; }
      if(!ref) return;
      const sets = (DATA.practice||[]).filter(x=>x.domain===d.code && x.date > base.date);
      if(!sets.length) return;
      const est = predictFor(d.code, sets);
      if(!est) return;
      const move = est.mid - (ref[0]+ref[1])/2;
      delta += w * move;
      /* untimed work already loses points off the level; it also buys less
         confidence, so it widens the interval instead of just shifting it */
      half  += w * (est.width/2) * (1 + est.untimedShare);
      nq    += est.n;
      moved.push({ code:d.code, name:d.name, weight:d.weight, move, n:est.n });
    });
    return { measured, score: measured + delta, delta, half, nq, moved };
  }

  const rw   = section(DATA.domains.rw,   base.rw);
  const math = section(DATA.domains.math, base.math);
  const weeks = Math.max(0, DAYS(D(base.date), TODAY) / 7);
  const drift = P.drift * weeks;
  const q = x => x*x;
  const half = Math.sqrt(q(rw.half) + q(math.half) + 2*q(P.sectionNoise) + q(drift));
  const total = rw.score + math.score;
  const conf  = Math.max(0, Math.min(99, Math.round(100 * (1 - half/P.confRef))));
  return {
    base, rw, math, weeks, drift, half: Math.round(half), conf,
    total: Math.round(total),
    lo: Math.round((total-half)/10)*10, hi: Math.round((total+half)/10)*10,
    nq: rw.nq + math.nq,
    moved: rw.moved.concat(math.moved)
  };
})();

/* human time: 45 -> "45 min", 150 -> "2 h 30 m", 180 -> "3 h", 0 -> "rest day" */
function HM(m){
  if(!m) return "rest day";

      + 'After a session, just say it out loud in the terminal:<br><br>'
      + '<code>log a miss: colons, picked B should be C, careless</code><br>'
      + '<code>3 misses today — 2 comma splice content, 1 modifier misread</code><br><br>'
      + 'Tags are exactly <b>content</b> · <b>misread</b> · <b>careless</b> · <b>timing</b>. '
      + 'The tag is the whole point: if <b>careless</b> clears 5 in a week, that is the real problem and no content review fixes it.'
      + '</div>';
    v.appendChild(c);

    v.appendChild(el("h2","sec","What each tag means"));
    const t = el("div","tiles");
    Object.keys(WHY).forEach(k=>{
      const tile = el("div","card tile");
      tile.style.setProperty("--c","var("+WHY[k]+")");
      tile.innerHTML = '<div class="n num" style="color:var(--faint)">0</div>'
        + '<div class="k" style="color:var('+WHY[k]+');text-transform:capitalize">'+k+'</div>'
        + '<div class="d">'+WHYTEXT[k]+'</div>';
      t.appendChild(tile);
    });
    v.appendChild(t);
    return;
  }

  /* ---- tiles ---- */
  const thisWeek = weekOf(TKEY);
  const byWhy = k => E.filter(e=>e.why===k);
  v.appendChild(el("h2","sec",E.length+" misses logged"));
  const tiles = el("div","tiles");
  Object.keys(WHY).forEach(k=>{
    const all = byWhy(k), wk = all.filter(e=>weekOf(e.date)===thisWeek).length;
    /* the README's rule: careless over 5 in ANY week is the real problem.
       Flag the worst week, not just the current one, so the signal never hides. */
    let worst = {n:null, c:0};
    DATA.weeks.forEach(w=>{
      const c = all.filter(e=>weekOf(e.date)===w.n).length;
      if(c > worst.c) worst = {n:w.n, c};
    });
    const alarm = k==="careless" && worst.c > 5;
    const now   = alarm && worst.n === thisWeek;
    const tile = el("div","card tile"+(alarm?" alarm":""));
    tile.style.setProperty("--c","var("+WHY[k]+")");
    tile.innerHTML = '<div class="n num">'+all.length+'</div>'
      + '<div class="k" style="'+(alarm?"":"color:var("+WHY[k]+")")+';text-transform:capitalize">'+k+'</div>'
      + '<div class="d">'+(wk?wk+" this week · ":"")+Math.round(all.length/E.length*100)+'% of all misses'
      + (alarm ? '<br><b style="color:var(--bad)">'+worst.c+' in week '+worst.n+(now?"":" (past)")
                 +'. Over 5 means this is the actual problem — no content review fixes it.</b>' : '')+'</div>';
    tiles.appendChild(tile);
  });
  v.appendChild(tiles);

  /* ---- weekly stacked bars ---- */
  v.appendChild(el("h2","sec","By week"));
  const wkCard = el("div","card"); wkCard.style.padding="20px 18px 16px";
  const perWeek = DATA.weeks.map(w=>{
    const rows = E.filter(e=>weekOf(e.date)===w.n);
    return { n:w.n, title:w.title, total:rows.length,
             by:Object.fromEntries(Object.keys(WHY).map(k=>[k, rows.filter(e=>e.why===k).length])) };
  });
  const maxWk = Math.max(...perWeek.map(w=>w.total), 1);
  let wh = '<div class="wkbars" style="min-height:170px">';
  perWeek.forEach(w=>{
    const h = w.total/maxWk*140;
    wh += '<div class="wkcol">'
       + '<div class="wkstack" style="height:'+h+'px">'
       + Object.keys(WHY).map(k=> w.by[k] ? '<span title="'+k+': '+w.by[k]+'" style="height:'+(w.by[k]/w.total*100)+'%;background:var('+WHY[k]+')"></span>' : "").join("")
       + '</div><div class="wkbase"></div>'
       + '<div class="cap"><b class="num">'+w.total+'</b>Week '+w.n+'<br><span style="color:var(--faint)">'+esc(w.title)+'</span></div></div>';
  });
  wh += '</div><div class="legend" style="margin-top:16px;border-top:1px solid var(--line);padding-top:13px">'
     + Object.keys(WHY).map(k=>'<span><i style="background:var('+WHY[k]+')"></i>'+k+' <b class="num">'+byWhy(k).length+'</b></span>').join("")
     + '</div>';
  wkCard.innerHTML = wh;
  v.appendChild(wkCard);

  /* ---- repeat offenders ---- */
  const groups = {};
  E.forEach(e=>{ const k=(e.rule||"—").trim().toLowerCase(); (groups[k]=groups[k]||{label:e.rule||"—", rows:[]}).rows.push(e); });
  const ranked = Object.values(groups).sort((a,b)=>b.rows.length-a.rows.length);
  const repeat = ranked.filter(g=>g.rows.length>=3);

  v.appendChild(el("h2","sec","Repeat offenders <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— 3+ misses, drill these first</span>"));
  const rc = el("div","card");
  if(!repeat.length){
    rc.innerHTML = '<div class="empty tiny">Nothing has been missed three times yet. '
      + (ranked.length ? 'Closest: <b style="color:var(--text)">'+esc(ranked[0].label)+'</b> at '+ranked[0].rows.length+'.' : '')+'</div>';
  } else {
    rc.innerHTML = '<div class="scroll"><table><thead><tr><th>Rule / concept</th><th>Times</th><th>Why it happens</th><th>Last seen</th></tr></thead><tbody>'
      + repeat.map(g=>{
          const mix = Object.keys(WHY).map(k=>({k,n:g.rows.filter(r=>r.why===k).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
          const last = g.rows.map(r=>r.date).sort().pop();
          return '<tr><td style="font-weight:580">'+esc(g.label)+'</td>'
            + '<td><b class="num" style="color:var(--bad);font-size:15px">'+g.rows.length+'</b></td>'
            + '<td>'+mix.map(m=>'<span class="why" style="background:var('+WHY[m.k]+');margin-right:5px">'+m.k+' '+m.n+'</span>').join("")+'</td>'
            + '<td class="num muted">'+FMT(last)+'</td></tr>';
        }).join("") + '</tbody></table></div>';
  }
  v.appendChild(rc);

  /* ---- domain heat ---- */
  const doms = {};
  E.forEach(e=>{ const k=e.domain||"—"; doms[k]=(doms[k]||0)+1; });
  const dlist = Object.entries(doms).sort((a,b)=>b[1]-a[1]);
  const dmax = Math.max(...dlist.map(d=>d[1]),1);
  v.appendChild(el("h2","sec","By domain"));
  const dc = el("div","card"); dc.style.padding="18px";
  dc.innerHTML = '<div class="bars">' + dlist.map(([n,c])=>
      '<div class="bar"><div class="nm">'+esc(n)+'</div>'
      + '<div class="tr"><span style="width:'+(c/dmax*100)+'%;background:var(--accent)"></span></div>'
      + '<div class="vl num">'+c+'</div></div>').join("") + '</div>';
  v.appendChild(dc);

  /* ---- the log itself ---- */
  v.appendChild(el("h2","sec","Every miss <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— newest first</span>"));
  const lc = el("div","card");
  const sorted = [...E].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  /* Rows carrying an `explanation` get a second, collapsed row underneath holding
     College Board's verbatim rationale, the question text, and a link back to the bank. */
  lc.innerHTML = '<div class="scroll"><table><thead><tr><th>Date</th><th>Source</th><th>Domain</th><th>Rule / concept</th><th>Answer</th><th>Why</th></tr></thead><tbody>'
    + sorted.map(e=>{
        const head = '<tr><td class="num" style="white-space:nowrap">'+FMT(e.date)+'</td>'
          + '<td class="muted">'+esc(e.source||"—")+(e.qid?'<div class="tiny num" style="color:var(--faint);margin-top:3px">ID # '+esc(e.qid)+'</div>':'')+'</td>'
          + '<td>'+esc(e.domain||"—")+'</td>'
          + '<td style="font-weight:540">'+esc(e.rule||"—")+(e.note?'<div class="tiny muted" style="margin-top:3px">'+esc(e.note)+'</div>':'')+'</td>'
          + '<td class="ac"><s>'+esc(e.picked||"?")+'</s> → <b>'+esc(e.correct||"?")+'</b></td>'
          + '<td><span class="why" style="background:var('+(WHY[e.why]||"--dim")+')">'+esc(e.why||"—")+'</span></td></tr>';
        if(!e.explanation) return head;
        const ch = (e.choices||[]).map(c=>{
          const right = e.correct && c.trim().indexOf(e.correct+")")===0;
          return '<li style="margin:0 0 3px;'+(right?'font-weight:640;color:var(--ok)':'color:var(--dim)')+'">'
               + esc(c)+(right?' ✓':'')+'</li>';
        }).join("");
        return head
          + '<tr><td colspan="6" style="padding:0 14px 12px">'
          + '<details style="font-size:12.5px;line-height:1.65">'
          + '<summary style="cursor:pointer;color:var(--accent);font-weight:560;padding:2px 0">'
          +   'College Board explanation</summary>'
          + '<div style="border-left:2px solid var(--line);padding:8px 0 2px 13px;margin-top:7px">'
          +   (e.stem?'<p style="margin:0 0 9px;color:var(--text)">'+esc(e.stem)+'</p>':'')
          +   (ch?'<ul style="list-style:none;padding:0;margin:0 0 10px">'+ch+'</ul>':'')
          +   '<p style="margin:0 0 9px;color:var(--dim)">'+esc(e.explanation)+'</p>'
          +   (e.link?'<a href="'+esc(e.link)+'" target="_blank" rel="noopener" style="color:var(--accent)">'
                     +'SAT Suite Question Bank ↗</a>'
                     +'<span class="tiny muted"> — filter to SAT, then this question’s section and domain, '
                     +'and match ID # '+esc(e.qid||"")+'. The bank has no per-question URL.</span>':'')
          + '</div></details></td></tr>';
      }).join("")
    + '</tbody></table></div>';
  v.appendChild(lc);
})();

/* ══════════════════ TOPICS ══════════════════ */
(function(){
  const v = $("#v-top");

  /* how many logged misses match each rule's tags */
  const hits = r => DATA.errors.filter(e=>{
    const s = ((e.rule||"")+" "+(e.note||"")).toLowerCase();
    return r.tags.some(t=>s.includes(t));
  }).length;

  const scored = DATA.rules.map(r=>({...r, hits:hits(r)}));
  const hot = scored.filter(r=>r.hits>0).sort((a,b)=>b.hits-a.hits);

  v.appendChild(el("h2","sec","Standard English Conventions <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— 26% of RW, 11–15 questions, currently the "+bandNow("SEC")+" band</span>"));

  const goal = el("div","card"); goal.style.cssText="padding:15px 18px;margin-bottom:14px";
  goal.innerHTML = '<div class="lab" style="margin-bottom:6px">The target</div>'
    + '<div style="font-size:14.5px;line-height:1.55">Name the rule being tested <b>before</b> looking at the answer choices. '
    + 'Every SEC question on the test reduces to one of the eight below.</div>';
  v.appendChild(goal);

  if(hot.length){
    const hs = el("div","card"); hs.style.cssText="padding:15px 18px;margin-bottom:14px;border-color:var(--bad)";
    hs.innerHTML = '<div class="lab" style="color:var(--bad);margin-bottom:9px">Your weak spots, from the error log</div>'
      + '<div class="bars">' + hot.map(r=>
          '<div class="bar"><div class="nm">Rule '+r.n+' · '+esc(r.title.split(" ").slice(0,3).join(" "))+'</div>'
          + '<div class="tr"><span style="width:'+(r.hits/hot[0].hits*100)+'%;background:var(--bad)"></span></div>'
          + '<div class="vl num">'+r.hits+'</div></div>').join("") + '</div>';
    v.appendChild(hs);
  }

  const g = el("div","rules");
  scored.forEach(r=>{
    const d = el("details","card rule");
    if(r.hits>=3) d.open = true;
    d.innerHTML = '<summary><span class="n">'+r.n+'</span><span class="t">'+esc(r.title)+'</span>'
      + (r.hits?'<span class="cnt num">'+r.hits+' missed</span>':'')+'</summary>'
      + '<div class="body">'+r.body+'</div>';
    g.appendChild(d);
  });
  v.appendChild(g);

  v.appendChild(el("h2","sec","Two near-rules"));
  const g2 = el("div","rules");
  DATA.nearRules.forEach(r=>{
    const d = el("details","card rule"); d.open = true;
    d.innerHTML = '<summary><span class="n">!</span><span class="t">'+r.title+'</span></summary>'
      + '<div class="body">'+r.body+'</div>';
    g2.appendChild(d);
  });
  v.appendChild(g2);

  v.appendChild(el("h2","sec","Transitions <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— technically Expression of Ideas, tested the same way</span>"));
  const tc = el("div","card");
  tc.innerHTML = '<div class="scroll"><table><thead><tr><th style="width:150px">Relationship</th><th>Words</th></tr></thead><tbody>'
    + DATA.transitions.map(t=>'<tr><td style="font-weight:600">'+esc(t.rel)+'</td><td class="muted">'+esc(t.words)+'</td></tr>').join("")
    + '</tbody></table></div>';
  v.appendChild(tc);
  v.appendChild(el("div","hint","<b>Method:</b> cover the transition word entirely. Read the sentence before and the sentence after. Decide the relationship <i>yourself</i>, then pick the word. The trap is a contrast word where the two sentences actually agree."));

  v.appendChild(el("h2","sec","Test-day timing"));
  const tm = el("div","tiles");
  [
    {n:"71 s", k:"RW per question", d:"27 questions, 32 min per module. But SEC should take 30–40 s — it is rule application, not reading. The seconds you save there buy the long inference questions at the end.", c:"--accent"},
    {n:"95 s", k:"Math per question", d:"22 questions, 35 min per module. Flag anything past 2 min and move. Reserve the last 3 min to recheck flags, not to attempt new questions.", c:"--ok"},
    {n:"M1", k:"The module that matters", d:"Module 1 performance sets module 2 difficulty, which sets your score ceiling. Do not rush module 1 to bank time.", c:"--warn"},
    {n:"0", k:"Blanks allowed", d:"No penalty for wrong answers. Guess on everything. On RW, two of four choices are usually eliminable mechanically.", c:"--test"}
  ].forEach(x=>{
    const t = el("div","card tile");
    t.style.setProperty("--c","var("+x.c+")");
    t.innerHTML = '<div class="n num" style="color:var('+x.c+')">'+x.n+'</div><div class="k">'+x.k+'</div><div class="d">'+x.d+'</div>';
    tm.appendChild(t);
  });
  v.appendChild(tm);
})();

/* ══════════════════ VOCAB ══════════════════ */
(function(){
  const v = $("#v-voc");

  v.appendChild(el("h2","sec","Words in context <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— Craft and Structure is 28% of RW, currently "+bandNow("CAS")+"</span>"));

  const method = el("div","card"); method.style.cssText="padding:15px 18px;margin-bottom:14px";
  method.innerHTML = '<div class="lab" style="margin-bottom:8px">The method</div>'
    + '<ol style="margin:0;padding-left:19px;font-size:13.5px;line-height:1.75;color:var(--dim)">'
    + '<li>Cover the answer choices.</li><li>Read the sentence and the one before it.</li>'
    + '<li>Say what word <b style="color:var(--text)">you</b> would put in the blank.</li>'
    + '<li>Uncover. Pick the closest match.</li></ol>'
    + '<div class="tiny" style="margin-top:10px;color:var(--faint)">If your prediction matches nothing, you misread the sentence’s logic. Reread rather than guessing among four unfamiliar words.</div>';
  v.appendChild(method);

  const search = el("input","searchbar");
  search.type = "search";
  search.placeholder = "Filter words…";
  v.appendChild(search);

  v.appendChild(el("h2","sec","Secondary meanings <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— click to reveal. The SAT tests common words used precisely, not obscure ones.</span>"));
  const sg = el("div","vgrid"); v.appendChild(sg);

  const mine = el("div"); v.appendChild(el("h2","sec","My words <span style=\"text-transform:none;letter-spacing:0;color:var(--faint);font-weight:500\">— add a word when you did not know it, or knew it and the SAT used a second meaning</span>"));
  v.appendChild(mine);

  function draw(q){
    q = (q||"").trim().toLowerCase();
    sg.innerHTML = "";
    DATA.secondary
      .filter(w => !q || (w.word+" "+w.sat+" "+w.everyday).toLowerCase().includes(q))
      .sort((a,b)=>(b.missed||0)-(a.missed||0))
      .forEach(w=>{
        const c = el("div","card vc");
        const face = () => '<div class="w">'+esc(w.word)+'</div>'
          + '<div class="ev">everyday: '+esc(w.everyday)+'</div>'
          + (w.missed?'<div class="miss num">×'+w.missed+'</div>':'')
          + (c.classList.contains("flip")
              ? '<div class="sat"><span class="k">SAT meaning</span>'+esc(w.sat)+'</div>'
              : '<div class="veil">tap for the SAT meaning</div>');
        c.innerHTML = face();
        c.onclick = ()=>{ c.classList.toggle("flip"); c.innerHTML = face(); };
        sg.appendChild(c);
      });

    const list = DATA.vocab.filter(w => !q || (w.word+" "+(w.mine||"")).toLowerCase().includes(q));
    if(!list.length){
      mine.innerHTML = '<div class="card empty">'
        + '<div class="big">'+(DATA.vocab.length ? "No match." : "No words yet.")+'</div>'
        + (DATA.vocab.length ? '' : '<div class="hint" style="text-align:left;max-width:520px;margin:16px auto 0">'
            + 'After a words-in-context set, say:<br><br><code>add vocab: tenuous — thin, barely holding together</code><br><br>'
            + 'Write the definition in your own words. A copied dictionary line does not stick.</div>')
        + '</div>';
    } else {
      mine.innerHTML = '<div class="card"><div class="scroll"><table><thead><tr><th style="width:170px">Word</th><th>My definition</th><th style="width:190px">Where</th><th style="width:70px">Missed</th></tr></thead><tbody>'
        + list.sort((a,b)=>(b.missed||0)-(a.missed||0)).map(w=>
            '<tr><td style="font-weight:620;font-size:14px">'+esc(w.word)+'</td>'
            + '<td>'+esc(w.mine||"—")+'</td><td class="muted tiny">'+esc(w.where||"—")+'</td>'
            + '<td>'+((w.missed||0) ? '<b class="num" style="color:var(--bad)">'+w.missed+'</b>' : '<span class="muted">—</span>')+'</td></tr>').join("")
        + '</tbody></table></div></div>';
    }
  }
  search.oninput = () => draw(search.value);
  draw("");
})();

/* ─────────── theme toggle ─────────── */
(function(){
  const root = document.documentElement;
  let saved = null;
  try{ saved = localStorage.getItem("sat-theme"); }catch(e){}
  if(saved) root.setAttribute("data-theme", saved);
  $("#theme").onclick = ()=>{
    const dark = matchMedia("(prefers-color-scheme:dark)").matches;
    const now  = root.getAttribute("data-theme") || (dark ? "dark" : "light");
    const next = now === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try{ localStorage.setItem("sat-theme", next); }catch(e){}
  };
})();
</script>
</body>
</html>
